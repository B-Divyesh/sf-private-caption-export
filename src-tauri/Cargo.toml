[package]
name = "private-caption-export"
version = "0.1.3"
description = "Consent-aware local caption excerpt tool"
authors = ["Param Factory"]
license = "MIT"
edition = "2021"

[lib]
name = "private_caption_export_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
